<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Registro Comicfest</title>
	<link rel="icon" href="C:\Users\Lighthouse\Desktop\CREDENCIALES\app\static\image.ico">
	<style>
		body{
			background-color: #f1f1f1;
		}
	</style>
	
  </head>
  <body>
  <br>
  <br>
	<div class="container">
		<div class="card text-center">
			<div class="card-header">
				REGISTRO DE CREDENCIALES COMICFEST COLOMBIA
			</div>
			<form action="{{ url_for('registrar') }}" method="post" target="_blank">
				<div class="card-body">
					<div class="row">
						<div class="col">
							<input type="text" id="marca" name="marca" required class="form-control" placeholder="Nombre de la marca">
						</div>
						<div class="col">
							<input type="text" id="nombre" name="nombre" required class="form-control" placeholder="Nombre completo">
						</div>
					</div>
					<br>
					<div class="form-group row">
						<label for="Tipo_de_documento" class="col-sm-2 col-form-label" required>Tipo de documento</label>
							<select class="form-control col-10" id="Tipo_de_documento" name="Tipo_de_documento">
								<option value="Cc">Cedula de Ciudadanía</option>
								<option value="Cc">Tarjeta de Identidad</option>
								<option value="Ce">Cedula de Extranjera</option>
								<option value="P">Pasaporte</option>
							</select>
					</div>
					<div class="row">
						<div class="col">
							<input type="tel" id="Numero_de_documento" required class="form-control" name="Numero_de_documento" placeholder="Numero de documento">
						</div>
					</div>
					
				</div>
				<div class="card-footer text-muted">
					<input type="submit" class="btn btn-outline-primary btn-lg" value="Enviar">
					<input type="reset" class="btn btn-outline-danger btn-lg" value="Limpiar">
				</div>
		  </form>
		</div>
	</div>
    
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
